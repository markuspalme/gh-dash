name: GHDash
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TermKit:
    url: https://github.com/migueldeicaza/TermKit
    # No tagged releases; pinned to a commit on main.
    revision: 2cdfc96f9c524251ae1f517a440f28150182b7c2
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # TermKit depends on SwiftTerm; releases after 1.11 ship a Metal shader
    # that Xcode can only build with the Metal toolchain installed.
    exactVersion: 1.11.2
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  GHDash:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markuspalme.GHDash
        PRODUCT_NAME: GHDash
        INFOPLIST_KEY_CFBundleDisplayName: GitHub Dashboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Not sandboxed: the app shells out to `gh auth token` for credentials.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  GHDashMobile:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markuspalme.GHDashMobile
        PRODUCT_NAME: GHDashMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: GHDash
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Running on a device needs your own team: set DEVELOPMENT_TEAM here or in Xcode.
        CODE_SIGN_STYLE: Automatic
  ghdash:
    type: tool
    platform: macOS
    sources:
      - Sources/Shared/Core
      - Sources/TUI
      - path: Sources/macOS/GitHubCLI.swift
    dependencies:
      - package: TermKit
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: ghdash
        # TermKit's views are plain classes; subclassing them under Swift 6's
        # strict concurrency checking is more fight than it is worth.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
