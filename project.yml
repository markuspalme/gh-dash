name: GHDash
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
targets:
  GHDash:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markuspalme.GHDash
        PRODUCT_NAME: GHDash
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: GitHub Dashboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Not sandboxed: the app shells out to `gh auth token` for credentials.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
